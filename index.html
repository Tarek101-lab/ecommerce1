<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Website</title>
    <link rel="stylesheet" href="index.css">
</head>

<body>
    <nav class="navbar">
        <div class="logo">MyLogo</div>
        <div class="welcome">Welcome to Our Site!</div>
        <div class="right-section">
            <div class="basket-icon-wrapper">
                <div class="cart-icon">🛒 <span id="basketCount" class="basket-badge">0</span></div>
                <div id="basketContainer" class="basket-container"></div>
            </div>
            <div id="userInfo" class="user-info" style="display: none;">
                <span id="userName"></span>
                <button id="logoutBtn" class="logout-btn">Logout</button>
            </div>
            <button class="login-btn" id="loginBtnNav">Login</button>
        </div>
    </nav>

    <div class="search-sort-container">
        <div class="search-bar">
            <input type="text" id="searchInput" placeholder="Search products...">
        </div>
        <div class="sort-by">
            <select id="sortSelect">
                <option value="name">Sort by Name</option>
                <option value="price-low">Price: Low to High</option>
                <option value="price-high">Price: High to Low</option>
                <option value="category">Sort by Category</option>
            </select>
        </div>
    </div>



    <div class="products-container" id="productsContainer">
        <!-- Fallback content in case JavaScript fails -->
        <div class="product-card">
            <img src="https://images.unsplash.com/photo-1521572163474-6864f9cf17ab?w=300&h=300&fit=crop" alt="T-Shirt" class="product-image">
            <div class="product-header">
                <div class="product-name">T-Shirt</div>
                <div class="heart-icon" data-id="1">♥</div>
            </div>
            <div class="product-category">Clothing</div>
            <div class="product-price">$29.99</div>
            <button class="add-to-basket-btn" data-id="1">Add to Basket</button>
        </div>
        <div class="product-card">
            <img src="https://images.unsplash.com/photo-1542272604-787c62d465d1?w=300&h=300&fit=crop" alt="Pants" class="product-image">
            <div class="product-header">
                <div class="product-name">Pants</div>
                <div class="heart-icon" data-id="2">♥</div>
            </div>
            <div class="product-category">Clothing</div>
            <div class="product-price">$59.99</div>
            <button class="add-to-basket-btn" data-id="2">Add to Basket</button>
        </div>
        <div class="product-card">
            <img src="https://images.unsplash.com/photo-1553062407-98eeb64c6a62?w=300&h=300&fit=crop" alt="Bag" class="product-image">
            <div class="product-header">
                <div class="product-name">Bag</div>
                <div class="heart-icon" data-id="3">♥</div>
            </div>
            <div class="product-category">Accessories</div>
            <div class="product-price">$89.99</div>
            <button class="add-to-basket-btn" data-id="3">Add to Basket</button>
        </div>
    </div>

    <script>
        // Simple test to see if JavaScript is working
        console.log('HTML script tag working');
        document.addEventListener('DOMContentLoaded', function() {
            console.log('DOM loaded');
        });
    </script>
    <script src="index.js"></script>
</body>

</html>
